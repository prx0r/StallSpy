<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bartholomew 3D — Final Character</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; overflow: hidden; font-family: system-ui; }
    #c { display: block; width: 100vw; height: 100vh; }
    .ui { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; flex-wrap: wrap; justify-content: center; }
    .b { padding: 6px 14px; background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.25); border-radius: 6px; color: #d4af37; cursor: pointer; font-size: 11px; transition: all 0.2s; }
    .b:hover { background: rgba(201,168,76,0.25); }
    .b.on { background: #d4af37; color: #0a0e14; }
    .s{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:12px 20px;color:#f5f0e7;font-size:14px;max-width:380px;text-align:center;opacity:0;transition:opacity .3s;z-index:10;pointer-events:none}.s.v{opacity:1}
    .st{position:fixed;top:12px;right:12px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;color:#d4af37;font-size:10px;font-family:monospace;z-index:10}
    .ld{position:fixed;inset:0;background:#0a0e14;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}.ld.h{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div class="ld" id="ld"><span style="color:#d4af37">Loading Bartholomew…</span></div>
  <canvas id="c"></canvas>
  <div class="s" id="sp"></div>
  <div class="st" id="st">idle</div>
  <div class="ui">
    <button class="b" onclick="B.go('idle')">Idle</button>
    <button class="b" onclick="B.go('listen')">Listen</button>
    <button class="b" onclick="B.go('think')">Think</button>
    <button class="b" onclick="B.go('talk')">Talk</button>
    <button class="b" onclick="B.go('fly')">Fly</button>
    <button class="b" onclick="B.go('celebrate')">Celebrate</button>
    <button class="b" onclick="B.say('Greetings! I am Bartholomew the Third!')">Speak</button>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import*as T from'three';
    import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
    import{OrbitControls}from'three/addons/controls/OrbitControls.js';

    const $=id=>document.getElementById(id);
    const sc=new T.Scene();sc.background=new T.Color(0x0a0e14);
    const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);cam.position.set(.5,.6,3.5);
    const rn=new T.WebGLRenderer({canvas:$('c'),antialias:true});rn.setSize(innerWidth,innerHeight);rn.setPixelRatio(Math.min(devicePixelRatio,2));rn.toneMapping=T.ACESFilmicToneMapping;rn.toneMappingExposure=1.2;
    const ctl=new OrbitControls(cam,rn.domElement);ctl.enableDamping=true;ctl.target.set(0,.3,0);

    sc.add(new T.AmbientLight(0xffffff,.5));
    const kl=new T.DirectionalLight(0xffd700,1.2);kl.position.set(3,4,3);sc.add(kl);
    const fl=new T.DirectionalLight(0xd4af37,.4);fl.position.set(-2,1,-2);sc.add(fl);
    const rl=new T.PointLight(0x6b3fa0,.5,10);rl.position.set(-1,2,-3);sc.add(rl);

    let bee=null,mixer=null,actions={},state='idle',mouse={x:0,y:0},t=0;

    window.B={
      go(s){state=s;$('st').textContent=s;if(mixer&&actions[s]){Object.values(actions).forEach(a=>a.stop());actions[s].reset().play();}},
      say(text){sp.textContent=text;sp.classList.add('v');if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.95;u.pitch=1.1;const v=window.speechSynthesis.getVoices();const en=v.find(x=>x.lang.startsWith('en')&&x.name.includes('Google'))||v.find(x=>x.lang.startsWith('en'));if(en)u.voice=en;u.onend=()=>{state='idle';$('st').textContent='idle';};window.speechSynthesis.speak(u);}setTimeout(()=>sp.classList.remove('v'),5000);}
    };

    document.addEventListener('mousemove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;});

    new GLTFLoader().load('../bartholomew-ai.glb',g=>{
      bee=g.scene;bee.scale.set(1.5,1.5,1.5);sc.add(bee);
      if(g.animations&&g.animations.length){mixer=new T.AnimationMixer(bee);g.animations.forEach(c=>{actions[c.name]=mixer.clipAction(c);});}
      $('ld').classList.add('h');
      B.say("I am Bartholomew the Third, Keeper of MythicBee!");
    },p=>{$('ld').querySelector('span').textContent='Loading… '+Math.round(p.loaded/p.total*100)+'%';},e=>{console.error(e);$('ld').querySelector('span').textContent='Error';});

    function anim(){requestAnimationFrame(anim);t+=.016;if(mixer)mixer.update(.016);if(bee){switch(state){case'idle':bee.position.y=Math.sin(t*1.5)*.08;bee.rotation.z=Math.sin(t*.8)*.04;break;case'listen':bee.position.y=Math.sin(t*2)*.05;bee.rotation.z=Math.sin(t*1.5)*.03;break;case'think':bee.rotation.x=.1+Math.sin(t*.6)*.05;break;case'talk':bee.position.y=Math.sin(t*2)*.04;break;case'fly':bee.position.y=.5+Math.sin(t*3)*.3;bee.rotation.z=Math.sin(t*2)*.2;break;case'celebrate':bee.position.y=Math.abs(Math.sin(t*3))*.4;bee.rotation.z=Math.sin(t*4)*.15;break;}}ctl.update();rn.render(sc,cam);}
    anim();
    addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rn.setSize(innerWidth,innerHeight);});
    setTimeout(()=>B.say("Greetings! I am Bartholomew the Third, Keeper of MythicBee! Who are we making mythical?"),1500);
  </script>
</body>
</html>
