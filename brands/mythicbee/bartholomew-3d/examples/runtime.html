<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bartholomew 3D — Runtime</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:radial-gradient(ellipse at 50% 30%,#141c28 0%,#0a0e14 70%);overflow:hidden;font-family:system-ui;color:#f5f0e7}
    #c{display:block;width:100vw;height:100vh}
    .ui{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10;flex-wrap:wrap;justify-content:center}
    .b{padding:6px 12px;background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.25);border-radius:6px;color:#d4af37;cursor:pointer;font-size:11px;transition:all .2s}
    .b:hover,.b.on{background:#d4af37;color:#0a0e14}
    .sp{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:12px 20px;font-size:14px;max-width:350px;text-align:center;opacity:0;transition:opacity .3s;z-index:10;pointer-events:none}
    .sp.v{opacity:1}
    .ld{position:fixed;inset:0;background:#0a0e14;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
    .ld.h{opacity:0;pointer-events:none}
    .fps{position:fixed;top:12px;left:12px;font-size:10px;font-family:monospace;color:#666;z-index:10}
  </style>
</head>
<body>
  <div class="ld" id="ld"><span style="color:#d4af37">Loading…</span></div>
  <canvas id="c"></canvas>
  <div class="sp" id="sp"></div>
  <div class="fps" id="fps"></div>
  <div class="ui">
    <button class="b on" onclick="B.go('idle',this)">Idle</button>
    <button class="b" onclick="B.go('listen',this)">Listen</button>
    <button class="b" onclick="B.go('think',this)">Think</button>
    <button class="b" onclick="B.go('talk',this)">Talk</button>
    <button class="b" onclick="B.go('fly',this)">Fly</button>
    <button class="b" onclick="B.go('celebrate',this)">🎉</button>
    <button class="b" onclick="B.say('Hello!')">🔊</button>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import*as T from'three';
    import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
    import{OrbitControls}from'three/addons/controls/OrbitControls.js';

    const $=id=>document.getElementById(id);
    const isMobile=()/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    // ── Scene ─────────────────────────────────────────────
    const sc=new T.Scene();
    sc.background=new T.Color(0x0a0e14);
    const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);
    cam.position.set(.5,.6,3.5);
    const rn=new T.WebGLRenderer({canvas:$('c'),antialias:!isMobile,alpha:false});
    rn.setSize(innerWidth,innerHeight);
    rn.setPixelRatio(Math.min(isMobile?1.5:2,devicePixelRatio));
    if(!isMobile){rn.toneMapping=T.ACESFilmicToneMapping;rn.toneMappingExposure=1.2;}
    const ctl=new OrbitControls(cam,rn.domElement);ctl.enableDamping=true;ctl.target.set(0,.3,0);

    sc.add(new THREE.AmbientLight(0xffffff,.5));
    const kl=new T.DirectionalLight(0xffd700,1);kl.position.set(3,4,3);sc.add(kl);
    if(!isMobile){const fl=new T.DirectionalLight(0xd4af37,.3);fl.position.set(-2,1,-2);sc.add(fl);}

    // ── State ─────────────────────────────────────────────
    let bee=null,state='idle',t=0,mouse={x:0,y:0};
    let wings=[],antTips=[],eyes=[],cape=null,smile=null;

    // Animation parameters (smooth interpolation targets)
    const anim={
      wingSpeed:14, wingAmp:0.45,
      bodyBob:0.08, bodyTilt:0.04,
      mouthOpen:0, mouthTarget:0,
      eyeX:0, eyeY:0,
      targetX:0, targetY:0
    };

    // ── Speech ────────────────────────────────────────────
    window.B={
      go(s,el){
        state=s;
        document.querySelectorAll('.b').forEach(b=>b.classList.remove('on'));
        if(el)el.classList.add('on');
        switch(s){
          case'idle':anim.wingSpeed=14;anim.wingAmp=0.45;anim.bodyBob=0.08;anim.bodyTilt=0.04;anim.mouthTarget=0;break;
          case'listen':anim.wingSpeed=9;anim.wingAmp=0.3;anim.bodyBob=0.05;anim.bodyTilt=0.03;anim.mouthTarget=0;break;
          case'think':anim.wingSpeed=7;anim.wingAmp=0.2;anim.bodyBob=0.04;anim.bodyTilt=0.06;anim.mouthTarget=0;break;
          case'talk':anim.wingSpeed=22;anim.wingAmp=0.35;anim.bodyBob=0.04;anim.bodyTilt=0.02;anim.mouthTarget=1;break;
          case'fly':anim.wingSpeed=24;anim.wingAmp=0.6;anim.bodyBob=0.3;anim.bodyTilt=0.2;anim.mouthTarget=0;break;
          case'celebrate':anim.wingSpeed=28;anim.wingAmp=0.7;anim.bodyBob=0.4;anim.bodyTilt=0.15;anim.mouthTarget=0.5;break;
        }
      },
      say(text){
        sp.textContent=text;sp.classList.add('v');
        if('speechSynthesis' in window){
          window.speechSynthesis.cancel();
          const u=new SpeechSynthesisUtterance(text);
          u.rate=0.95;u.pitch=1.1;
          const v=window.speechSynthesis.getVoices();
          const en=v.find(x=>x.lang.startsWith('en')&&x.name.includes('Google'))||v.find(x=>x.lang.startsWith('en'));
          if(en)u.voice=en;
          u.onstart=()=>{state='talk';anim.mouthTarget=1;};
          u.onend=()=>{state='idle';anim.mouthTarget=0;};
          window.speechSynthesis.speak(u);
        }
        setTimeout(()=>sp.classList.remove('v'),5000);
      }
    };

    // ── Mouse ─────────────────────────────────────────────
    document.addEventListener('mousemove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;});

    // ── Load GLB ──────────────────────────────────────────
    new GLTFLoader().load('../bartholomew-ai.glb',g=>{
      bee=g.scene;
      bee.scale.set(1.5,1.5,1.5);
      bee.traverse(c=>{
        if(c.name&&c.name.includes('Wing'))wings.push(c);
        if(c.name&&c.name.includes('AntennaTip'))antTips.push(c);
        if(c.name&&c.name.includes('Eye'))eyes.push(c);
        if(c.name&&c.name==='Cape')cape=c;
        if(c.name&&c.name==='Smile')smile=c;
      });
      sc.add(bee);
      $('ld').classList.add('h');
      setTimeout(()=>B.say("I am Bartholomew the Third!"),1000);
    },p=>{$('ld').querySelector('span').textContent='Loading… '+Math.round(p.loaded/p.total*100)+'%';},e=>{$('ld').querySelector('span').textContent='Error';});

    // ── Animation Loop ────────────────────────────────────
    let t=0,frameCount=0,lastFps=0;
    function anim(){
      requestAnimationFrame(anim);
      const delta=0.016;// Fixed timestep for simplicity
      t+=delta;
      frameCount++;

      // FPS counter
      if(frameCount%30===0){lastFps=Math.round(1/delta);$('fps').textContent=lastFps+' fps';}

      if(!bee)return;

      // Smooth interpolation (the key to feeling alive)
      const bobTarget=Math.sin(t*1.5)*anim.bodyBob;
      const tiltTarget=Math.sin(t*0.8)*anim.bodyTilt;
      const mouthTarget=anim.mouthTarget;

      bee.position.y+=(bobTarget-bee.position.y)*0.08;
      bee.rotation.z+=(tiltTarget-bee.rotation.z)*0.08;

      // State-specific overrides
      if(state==='talk'){
        bee.rotation.z=Math.sin(t*1.5)*0.02;
        bee.position.y+=Math.sin(t*2)*0.03;
      }else if(state==='fly'){
        bee.position.y=0.5+Math.sin(t*3)*0.3;
        bee.rotation.z=Math.sin(t*2)*0.2;
        bee.position.x=Math.sin(t*1.5)*0.3;
      }else if(state==='celebrate'){
        bee.position.y=Math.abs(Math.sin(t*3))*0.4;
        bee.rotation.z=Math.sin(t*4)*0.15;
      }else if(state==='think'){
        bee.rotation.x=0.1+Math.sin(t*0.6)*0.05;
      }

      // Wing flutter (continuous, speed varies by state)
      wings.forEach((w,i)=>{
        w.rotation.y=Math.sin(t*anim.wingSpeed+(i*2))*(anim.wingAmp+i*0.08);
      });

      // Antennae spring
      antTips.forEach((at,i)=>{
        at.position.y=0.58+Math.sin(t*2.5+i*1.5)*0.025;
      });

      // Cape sway
      if(cape)cape.rotation.x=0.15+Math.sin(t*2.2)*0.12;

      // Mouth morph
      if(smile)smile.scale.y=1+anim.mouthOpen*0.4;

      // Eye tracking
      eyes.forEach(e=>{
        e.position.x+=(0.56+mouse.x*0.02-e.position.x)*0.08;
        e.position.y+=(0.18+mouse.y*0.015-e.position.y)*0.08;
      });

      ctl.update();
      rn.render(sc,cam);
    }
    anim();

    // ── Resize ────────────────────────────────────────────
    addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rn.setSize(innerWidth,innerHeight);});
  </script>
</body>
</html>
