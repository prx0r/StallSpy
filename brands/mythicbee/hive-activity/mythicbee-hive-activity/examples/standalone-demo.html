<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hive Activity Demo</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff9ed;color:#2f2418;font-family:Inter,ui-sans-serif,system-ui}
.card{width:min(720px,88vw);padding:48px;border-radius:28px;background:rgba(255,255,255,.76);box-shadow:0 24px 80px rgba(98,70,30,.12);border:1px solid rgba(124,87,38,.08)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-bottom:20px}
.line{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px}
.glyph{color:#e6a62f;animation:breathe 1.3s ease-in-out infinite}
.word{color:transparent;background:linear-gradient(96deg,rgba(84,57,30,.35) 0%,rgba(139,96,46,.75) 38%,#efa932 50%,rgba(139,96,46,.75) 62%,rgba(84,57,30,.35) 100%);background-size:260% 100%;background-clip:text;-webkit-background-clip:text;animation:shine 2.15s linear infinite}
.sub{margin-top:20px;font-size:14px;opacity:.52}
@keyframes shine{from{background-position:135% 0}to{background-position:-135% 0}}
@keyframes breathe{0%,100%{transform:scale(.9) rotate(-6deg);opacity:.55}50%{transform:scale(1.08) rotate(7deg);opacity:1}}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Bartholomew III · Christmas Hive</div>
  <div class="line"><span class="glyph">✦</span><span class="word" id="word">Consulting the hive…</span></div>
  <div class="sub">Static standalone demo. Production component uses the TypeScript engine, seasonal overlays, bee bias, contextual hooks, cooldowns and telemetry.</div>
</div>
<script>
const words=[
"Consulting the hive…","Stinging the elves…","Putting Dad on the team sheet…",
"Checking Santa's fulfilment SLA…","Reconsidering the Wembley incident…",
"Asking Gerald for some reason…","Making it mythical…","Packing the satchel…"
];
let i=0;
setInterval(()=>{i=(i+1)%words.length; document.getElementById('word').textContent=words[i]},2800);
</script>
</body>
</html>
